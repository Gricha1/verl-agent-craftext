# Hyperparameters for dual-LLM PPO on debug_square_8x8:
# discounted remaining return G_t^gamma with gamma=0.99
#
#   bash examples/ppo_trainer/ppo_debug_square_gt_g099.sh
#
# Same as failed undiscounted G_t baseline (2a42e153), except:
#   remaining_return_gamma=0.99  (NOT algorithm.gamma alone)

job:
  run_name: "ds8_dual_gt_g099_h50"
  num_optimistic_envs: 64
  optimistic_reset_ratio: 8
  use_actor_lora: true
  critic_lora_rank: 64
  critic_lora_alpha: 64
  total_epochs: 8000
  history_length: 50
  checkpoint_dir: training_checkpoints/verl_agent_caged_craftext_debug_square_dual_gt_g099

overrides:
  - ++env.craftext_settings=debug_square_8x8
  - +env.use_optimistic_parallel=True
  - +env.optimistic_reset_ratio=8
  - +env.use_ray_text_render_workers=False
  - +env.value_return_min=-5
  - +env.value_return_max=6
  - +env.value_return_bin_step=0.4
  - ++env.use_jax_gpu=False
  - ++env.jax_gpu_fraction=0.15
  - env.history_length=50

  # Token score = discounted return-to-go G_t^0.99 (explicit; not r_t, not full R).
  - reward_model.use_episode_return_as_token_reward=False
  - reward_model.use_remaining_return_as_token_reward=True
  - reward_model.remaining_return_gamma=0.99
  # Keep PPO gamma=1 for response-level GAE identity (response_len=1 → returns≈token score).
  - algorithm.gamma=1.0
  - algorithm.lam=1.0
  - algorithm.gae_by_trajectory=False
  - algorithm.use_actor_value_token=False
  - actor_rollout_ref.actor.actor_value_token=False

  - actor_rollout_ref.rollout.gpu_memory_utilization=0.55
  - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=16
  - actor_rollout_ref.actor.ppo_mini_batch_size=64
  - critic.ppo_micro_batch_size_per_gpu=16
  - critic.ppo_mini_batch_size=64
  - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=8
  - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=8

  - actor_rollout_ref.rollout.val_kwargs.temperature=1.0
  - actor_rollout_ref.actor.entropy_coeff=0.01
  - actor_rollout_ref.actor.entropy_over_valid_actions=False
  - critic.model.lora_rank=64
  - critic.model.lora_alpha=64

  - trainer.resume_mode=disable
  - trainer.save_freq=-1
  - trainer.test_freq=20
  - trainer.max_actor_ckpt_to_keep=1
  - trainer.max_critic_ckpt_to_keep=1
  - trainer.default_local_dir=training_checkpoints/verl_agent_caged_craftext_debug_square_dual_gt_g099
  - trainer.n_gpus_per_node=2
  - trainer.nnodes=1
