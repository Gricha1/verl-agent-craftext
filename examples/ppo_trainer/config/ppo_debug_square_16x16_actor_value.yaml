# Hyperparameters for:
#   bash examples/ppo_trainer/ppo_debug_square_16x16_actor_value.sh
#
# Edit this file, then re-run the shell script. Env vars still override job.* when set.
# Extra CLI Hydra overrides after the script still win (appended last).

job:
  run_name: "PPO Debug Square 16x16 dual-prompt actor value"
  num_optimistic_envs: 64
  optimistic_reset_ratio: 8
  critic_warmup: 0
  use_actor_lora: true
  total_epochs: 8000
  engine: vllm
  no_reasoning: true
  auto_reset: false
  use_action_head: false
  prompt_template_type: single_token_action
  observation_type: ascii
  # Shell-side return-bin helpers (also mirrored under hydra overrides below)
  return_bin_min: -26
  return_bin_max: 16
  return_bin_step: 1.5
  actor_value_loss_coef: 1.0
  actor_value_separate_optimizer_steps: true
  actor_value_target_encoding: two_hot
  actor_value_entropy_coef: 0.1
  entropy_single_token_fastpath: true
  entropy_band_enable: false
  entropy_band_low: 0.7
  entropy_band_high: 1.4
  entropy_band_coef_lr: 0.05
  entropy_band_coef_low: 0.0
  entropy_band_coef_high: 1.0
  checkpoint_dir: training_checkpoints/verl_agent_caged_craftext_debug_square_16x16_actor_value

# -----------------------------------------------------------------------------
# Memory / training notes
# -----------------------------------------------------------------------------
# Gradient checkpointing (activation recomputation): ON for actor + critic.
#   actor_rollout_ref.model.enable_gradient_checkpointing = True
#   critic.model.enable_gradient_checkpointing = True
# This reduces activation RAM during FSDP backward; it does NOT fix vLLM
# wake_up(kv_cache) OOM (CuMem remap after FSDP sleep). For that we keep
# gpu_memory_utilization / micro-batches lower than the crashed run (0.8 / 64).
#
# Crashed run peak: max_memory_reserved_gb ≈ 140 / 160 (2xA100), OOM at step 78
# on wake_up(tags=["kv_cache"]).

# Flat Hydra overrides passed to run_caged_craftext_lora_job.sh / main_ppo.
# Order: base job script defaults → these overrides → optional CLI extras.
overrides:
  # --- env ---
  - ++env.craftext_settings=debug_square_16x16
  - +env.use_optimistic_parallel=True
  - +env.optimistic_reset_ratio=8
  - +env.use_ray_text_render_workers=False
  - +env.value_prompt_template_type=single_token_return
  - +env.value_return_min=-26
  - +env.value_return_max=16
  - +env.value_return_bin_step=1.5
  - ++env.use_jax_gpu=False
  - ++env.jax_gpu_fraction=0.15

  # --- algorithm / actor-value ---
  - algorithm.use_actor_value_token=True
  # False: token already carries G_t (remaining return). Trajectory GAE would double-count.
  - algorithm.gae_by_trajectory=False
  - actor_rollout_ref.actor.actor_value_token=True
  - actor_rollout_ref.actor.actor_value_loss_coef=1.0
  - actor_rollout_ref.actor.actor_value_separate_optimizer_steps=true
  - actor_rollout_ref.actor.actor_value_target_encoding=two_hot
  - actor_rollout_ref.actor.actor_value_entropy_coef=0.1
  - actor_rollout_ref.actor.actor_value_target_from_returns=True
  - actor_rollout_ref.actor.actor_value_return_min=-26
  - actor_rollout_ref.actor.actor_value_return_max=16
  - actor_rollout_ref.actor.actor_value_return_bin_step=1.5

  # --- gradient checkpointing (already True in base job; pinned here) ---
  - actor_rollout_ref.model.enable_gradient_checkpointing=True
  - critic.model.enable_gradient_checkpointing=True

  # --- memory (safer after wake_up OOM; raise carefully if stable) ---
  - actor_rollout_ref.rollout.gpu_memory_utilization=0.55
  - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=16
  - actor_rollout_ref.actor.ppo_mini_batch_size=64
  - critic.ppo_micro_batch_size_per_gpu=16
  - critic.ppo_mini_batch_size=64
  - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=8
  - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=8
  - actor_rollout_ref.actor.fsdp_config.param_offload=False
  - actor_rollout_ref.actor.fsdp_config.optimizer_offload=False
  - critic.model.fsdp_config.param_offload=False
  - critic.model.fsdp_config.optimizer_offload=False

  # --- entropy / sampling ---
  - actor_rollout_ref.rollout.val_kwargs.temperature=1.0
  - actor_rollout_ref.actor.entropy_coeff=0.01
  - actor_rollout_ref.actor.entropy_coeff_schedule.enable=False
  - actor_rollout_ref.actor.entropy_band.enable=false
  - actor_rollout_ref.actor.entropy_band.low=0.7
  - actor_rollout_ref.actor.entropy_band.high=1.4
  - actor_rollout_ref.actor.entropy_band.coef_lr=0.05
  - actor_rollout_ref.actor.entropy_band.coef_low=0.0
  - actor_rollout_ref.actor.entropy_band.coef_high=1.0
  - actor_rollout_ref.actor.entropy_over_valid_actions=True
  - actor_rollout_ref.actor.entropy_action_single_token_fastpath=true
  - actor_rollout_ref.actor.entropy_action_batched_forward=False
  - actor_rollout_ref.actor.entropy_action_length_normalize=True

  # --- trainer ---
  - trainer.critic_warmup=0
  - trainer.resume_mode=disable
  - trainer.save_freq=-1
  - trainer.test_freq=20
  - trainer.max_actor_ckpt_to_keep=1
  - trainer.max_critic_ckpt_to_keep=1
  - trainer.default_local_dir=training_checkpoints/verl_agent_caged_craftext_debug_square_16x16_actor_value
