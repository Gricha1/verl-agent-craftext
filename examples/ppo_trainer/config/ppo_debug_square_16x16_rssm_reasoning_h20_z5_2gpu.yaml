# Online Dual-PPO + continuous reward-RSSM on exactly two GPUs.
# Actor/critic prompts are task + soft(h)x20 + soft(z)x5 only; the live
# observation is available only to RSSM posterior/reconstruction code.
job:
  run_name: "ds16_dualppo_rssm_reasoning_h20_z5_2gpu"
  num_optimistic_envs: 64
  optimistic_reset_ratio: 8
  use_actor_lora: true
  critic_lora_rank: 64
  critic_lora_alpha: 64
  total_epochs: 8000
  history_length: 50
  max_response_length: 320
  checkpoint_dir: training_checkpoints/ds16_dualppo_rssm_reasoning_h20_z5_2gpu

overrides:
  - ++env.craftext_settings=debug_square_16x16
  - +env.use_optimistic_parallel=True
  - +env.optimistic_reset_ratio=8
  - +env.use_ray_text_render_workers=False
  - ++env.use_jax_gpu=False
  - env.auto_reset=True
  - env.max_steps=50
  - env.history_length=50
  # enable_reasoning is already present in the base PPO environment config;
  # use a normal override (Hydra rejects `+` for an existing key).
  - env.enable_reasoning=True
  - env.prompt_template_type=single_token_action_reasoning
  - data.max_prompt_length=256
  - data.max_response_length=320
  # aicenter3's existing rollout parquet has 32 training rows; a larger
  # batch is dropped by the dataloader and yields zero PPO updates.
  - data.train_batch_size=32
  - data.truncation=left
  # Prompts are already bounded by this fixed debug-square dataset.  Avoid a
  # post-JAX fork in datasets' overlong-prompt filter on native workers.
  - data.filter_overlong_prompts=False

  # Soft-token positions must survive rollout, actor and critic forwards.
  - actor_rollout_ref.model.use_remove_padding=False
  - critic.model.use_remove_padding=False
  - actor_rollout_ref.rollout.name=vllm
  - +actor_rollout_ref.rollout.enable_prompt_embeds=True
  - actor_rollout_ref.rollout.gpu_memory_utilization=0.45
  - actor_rollout_ref.rollout.tensor_model_parallel_size=1
  - actor_rollout_ref.rollout.enable_chunked_prefill=True
  - actor_rollout_ref.rollout.enforce_eager=True
  - actor_rollout_ref.rollout.free_cache_engine=True
  # Reasoning is free-form; action extraction remains the environment's tagged
  # canonical-action parser rather than a one-token constrained decoder.
  - +actor_rollout_ref.rollout.constrain_single_token_actions=False
  - actor_rollout_ref.actor.entropy_over_valid_actions=False

  # Two-GPU adaptation: match the available 32-row rollout dataset while
  # retaining headroom for vLLM plus frozen Qwen.
  - actor_rollout_ref.actor.ppo_mini_batch_size=32
  - actor_rollout_ref.actor.ppo_micro_batch_size_per_gpu=8
  - critic.ppo_mini_batch_size=32
  - critic.ppo_micro_batch_size_per_gpu=8
  - actor_rollout_ref.rollout.log_prob_micro_batch_size_per_gpu=8
  - actor_rollout_ref.ref.log_prob_micro_batch_size_per_gpu=8

  - +actor_rollout_ref.rssm.enable=True
  - +actor_rollout_ref.rssm.h_dim=512
  - +actor_rollout_ref.rssm.z_dim=512
  - +actor_rollout_ref.rssm.h_soft_tokens=20
  - +actor_rollout_ref.rssm.z_soft_tokens=5
  - +actor_rollout_ref.rssm.beta_kl=0.1
  - +actor_rollout_ref.rssm.free_nats=0.0
  - +actor_rollout_ref.rssm.lambda_recon=1.0
  - +actor_rollout_ref.rssm.lambda_reward=1.0
  - +actor_rollout_ref.rssm.lambda_continue=1.0
  - +actor_rollout_ref.rssm.reward_continuation_heads=True
  - +actor_rollout_ref.rssm.observation_max_tokens=512
  - +actor_rollout_ref.rssm.lr=1.0e-4
  - +actor_rollout_ref.rssm.weight_decay=0.0
  - +actor_rollout_ref.rssm.grad_clip=1.0
  - +actor_rollout_ref.rssm.micro_batch_size=16
  - +actor_rollout_ref.rssm.init_seed=20261012

  - trainer.world_model.enable=True
  - trainer.world_model.task=rssm
  - trainer.world_model.loss_coef=1.0
  - trainer.n_gpus_per_node=2
  - trainer.nnodes=1
  - trainer.resume_mode=disable
  - trainer.val_before_train=False
  - trainer.save_freq=100
  - trainer.test_freq=20
  - trainer.default_local_dir=training_checkpoints/ds16_dualppo_rssm_reasoning_h20_z5_2gpu
