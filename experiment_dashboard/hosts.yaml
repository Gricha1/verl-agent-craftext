    ssh: aicenter2
  - id: aicenter3
    label: aicenter3
    ssh: aicenter3
  - id: ml3
    label: ml3
    ssh: ml3
  - id: ml4
    label: ml4
    ssh: ml4
  - id: h200
    label: h200
    ssh: h200
